services:
  db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tunnelconv
    ports:
      - "54401:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tunnelconv"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    ports:
      - "8201:8000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/tunnelconv
      JWT_SECRET: tunnelconv-dev-secret
      SESSION_SECRET: tunnelconv-session-secret
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "3201:80"
    depends_on:
      - backend

volumes:
  pgdata:
